name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'android-app/**'
      - 'public/icons/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project and icons
        run: |
          npx cap add android
          npm run icons
          npx cap sync android

      - name: Build debug APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../KanaDojo.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KanaDojo-apk
          path: android-app/KanaDojo.apk

      - name: Publish APK to the "android-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=android-latest
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" KanaDojo.apk \
            --title "KanaDojo Android (latest build)" \
            --notes "APK built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Download KanaDojo.apk on your phone and open it to install (allow installs from unknown sources)." \
            --target "$GITHUB_SHA" \
            --prerelease
