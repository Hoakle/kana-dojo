name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'android-app/**'
      - 'scripts/mobile/**'
      - 'app/**'
      - 'core/**'
      - 'features/**'
      - 'shared/**'
      - 'widgets/**'
      - 'entities/**'
      - 'public/**'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build offline French site
        run: ./scripts/mobile/build-mobile.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: android-app
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk KanaDojo.apk
          ls -lh KanaDojo.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KanaDojo-apk
          path: android-app/KanaDojo.apk

      - name: Publish APK to the "android-latest" release
        working-directory: android-app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=android-latest
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" KanaDojo.apk \
            --title "KanaDojo Android (hors ligne, français)" \
            --notes "APK built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Works offline. Download KanaDojo.apk on your phone and open it to install." \
            --target "$GITHUB_SHA" \
            --prerelease
